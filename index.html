<script>
const FORMATS=['Nicht angegeben','DVD','Blu-ray','4K UHD','VHS','HD DVD','LaserDisc','Sonstiges'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IMG='https://image.tmdb.org/t/p/';
let films=JSON.parse(localStorage.getItem('films')||'[]');
let cfg=JSON.parse(localStorage.getItem('cfg')||'{}');
let wish=JSON.parse(localStorage.getItem('wish')||'[]');
const APP_VERSION='1.2';
let tab='films',onCode=null,lastQ={t:'',code:''},adv={},noE=false,noSeen=false,view=localStorage.getItem('view')||'grid';
const allFormats=()=>cfg.formats||FORMATS;
const _save=()=>{localStorage.setItem('wish',JSON.stringify(wish));localStorage.setItem('films',JSON.stringify(films));localStorage.setItem('cfg',JSON.stringify(cfg))};
const save=()=>{_save();queuePush()};
const wiki=n=>`https://de.wikipedia.org/w/index.php?search=${encodeURIComponent(n)}&go=Go`;

async function tmdb(path,p={}){
  if(!cfg.tmdb){openSet();throw new Error('TMDB-Schlüssel fehlt')}
  const u=new URL('https://api.themoviedb.org/3'+path);
  u.searchParams.set('language','de-DE');Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));

  dl.innerHTML=`${(d.poster||f.cover)?`<div class="kbg" style="background-image:url('${f.cover||IMG+'w500'+d.poster}')"></div>`:''}<div class="row">${d.poster||f.cover?`<img class="zc" crossorigin="anonymous" onclick="zoomCover(this.dataset.full)" data-full="${esc(f.cover||IMG+'original'+d.poster)}" onload="tintFrom(this,this.closest('dialog'))" src="${esc(f.cover||IMG+'w500'+d.poster)}">`:''}<div>
  <div class="ttlrow"><div class="ttl">${esc(d.title)}</div>${fskCircle(f.fsk||d.fsk)}</div><div class="meta">${esc(d.year)}${f.format?' · '+esc(f.format):''}${f.edition?' · '+esc(f.edition):''}</div>
  ${d.orig&&d.orig!==d.title?`<div class="mut">Originaltitel: ${esc(d.orig)}</div>`:''}
  ${f.title0&&mism(f)?`<div class="mut">⚠ Auf deiner Liste: ${esc(f.title0)}</div>`:''}${d.tagline?`<i class="mut">${esc(d.tagline)}</i>`:''}
  <div class="fq">${allFormats().map(x=>`<button class="chip ${x===f.format?'on':''}" data-v="${esc(x)}" onclick="setFormat('${id}',this.dataset.v)">${esc(x)}</button>`).join('')}</div><div class="box"><b>Meine Version</b><br>Format: ${esc(f.format)}${f.edition?' · '+esc(f.edition):''}${f.loc?'<br>Lagerort: '+esc(f.loc):''}${f.box?'<br>Box: '+esc(f.box):''}${f.lentTo?'<br>Verliehen an: '+esc(f.lentTo)+(f.lentSince?' seit '+f.lentSince.split('-').reverse().join('.'):''):''}<br>Bildformat: ${esc(f.aspect||'–')}<br>Tonformat: ${esc(f.ton||'–')}${f.region?'<br>Region: '+esc(f.region):''}${f.disks?'<br>Anzahl Disks: '+esc(f.disks):''}${f.bonus?'<br>Bonusmaterial: '+esc(f.bonus):''}${f.seen?'<br>✓ Gesehen':''}${(f.fsk||d.fsk)?'<br>FSK: '+esc(f.fsk||d.fsk):''}${f.langs?'<br>Sprachen: '+esc(f.langs):''}${f.subs?'<br>Untertitel: '+esc(f.subs):''}${serOf(f)?'<br>Filmreihe: '+esc(serOf(f)):''}${f.ean?'<br>Code: '+esc(f.ean):''}${f.notes?'<br>'+esc(f.notes):''}</div>
  <p>${d.runtime?d.runtime+' Min · ':''}${esc(d.genres.join(', '))}<br>Land: ${esc(d.countries.join(', ')||'–')}<br>Produktionsjahr: ${esc(d.year||'–')}<br>Studio: ${esc(d.studio||'–')}<br>Originalsprache: ${esc(d.spoken||'–')}<br>Kinostart: ${esc(dde(d.kinostart)||'–')}<br>
  ⭐ IMDb: ${d.imdb?esc(d.imdb)+'/10':(cfg.omdb?'–':'– <small class="mut">(OMDb-Schlüssel in ⚙︎ eintragen)</small>')}${d.imdbId?` (<a target="_blank" href="https://www.imdb.com/title/${d.imdbId}">IMDb</a>)`:''}${d.tmdbRating?` · TMDB: ${d.tmdbRating}`:''}</p>
  </div></div>
  <p>${esc(d.overview||'Keine Beschreibung.')}</p>
  ${boxMembers(f)}
  <div class="sec"><h3>Regie</h3><div class="chips">${(d.dirs||d.directors.map(n=>({n}))).map(x=>`<a class="chip2 pc" target="_blank" href="${wiki(x.n)}">${av(x.p,x.n)}<span><b>${esc(x.n)}</b></span></a>`).join('')||'<span class="mut">–</span>'}</div></div>
  <div class="sec"><h3>Darsteller</h3><div class="chips">${(d.cast||[]).slice(0,6).map(castChip).join('')||'<span class="mut">–</span>'}</div>${(d.cast||[]).length>6?`<div class="chips rest" style="display:none;margin-top:8px">${d.cast.slice(6).map(castChip).join('')}</div><button class="more" onclick="this.previousElementSibling.style.display='flex';this.remove()">Alle ${d.cast.length} Darsteller anzeigen</button>`:''}</div>
  <div class="sec"><h3>Kritiken</h3><a target="_blank" href="https://www.themoviedb.org/movie/${f.tmdbId||''}/reviews">auf TMDB ansehen</a></div>
  ${d.trailer?`<iframe src="https://www.youtube-nocookie.com/embed/${d.trailer}" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><p><a target="_blank" href="https://www.youtube.com/watch?v=${d.trailer}">Trailer auf YouTube öffnen</a> (falls das Video oben nicht lädt)</p>`:'<p class="mut">Kein Trailer gefunden.</p>'}
  ${d.unmatched?`<p>⚠ Noch nicht automatisch zugeordnet.</p><button class="p" onclick="relink('${id}')">Film zuordnen</button>`:''}<div id="mx" class="bar" style="display:none"><button onclick="refresh('${id}',this)">Infos aktualisieren</button><button onclick="pickCover('${id}')">Cover wählen</button><button onclick="relink('${id}')">Anderen Film zuordnen</button><button onclick="del('${id}')">Löschen</button></div>
  <div class="bar abar"><button class="p" onclick="openEdit('${id}')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Bearbeiten</span></button><button onclick="toggleSeen('${id}')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>${f.seen?'Als ungesehen':'Gesehen'}</span></button><button data-t="${esc(d.title)}" onclick="openMusic(this.dataset.t)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Titelmusik</span></button><button onclick="const m=document.getElementById('mx');m.style.display=m.style.display==='flex'?'none':'flex'">Mehr</button></div>`;
  dl.showModal();flyIn(dl);
}
async function refresh(id,b){b.textContent='Lädt…';try{const f=films.find(x=>x.id===id);f.d=await fetchDetails(f.tmdbId);save();draw();openDetail(id)}catch(e){alert(e.message);b.textContent='Infos aktualisieren'}}
function del(id){if(confirm('Film wirklich löschen?')){films=films.filter(f=>f.id!==id);save();draw();$('#dlg').close()}}

let draft={};
function openAdd(ean=''){onCode=null;
  draft={ean};
  $('#dlg').innerHTML=`<h2>Film hinzufügen</h2>
  <div style="display:flex;gap:8px"><input id="s" style="flex:1" placeholder="Titel (optional Jahr: Alien 1979)" onkeydown="if(event.key==='Enter')search()"><button class="p" onclick="search()">Suchen</button></div>
  <div class="bar"><button onclick="scan()">📷 Code scannen</button><span class="mut" style="align-self:center">EAN-Barcode oder QR-Code</span></div>
  <div id="scanbox"></div><div id="res"></div>
  <div class="bar"><button onclick="$('#dlg').close()">Abbrechen</button></div>`;
  if(!$('#dlg').open)$('#dlg').showModal();$('#s').focus();
}
async function search(q){
  q=q||$('#s').value.trim();if(!q)return;
  const m=q.match(/^(.*?)\s+((?:19|20)\d\d)$/),p={query:m?m[1]:q};if(m)p.year=m[2];
  $('#res').innerHTML='<p class="mut">Suche…</p>';
  try{const r=(await tmdb('/search/movie',p)).results.slice(0,12);
  $('#res').innerHTML=r.map(x=>`<div class="res" onclick="pick(${x.id})">${x.poster_path?`<img src="${IMG}w92${x.poster_path}">`:'<div style="width:46px"></div>'}<div><b>${esc(x.title)}</b> <span class="mut">(${(x.release_date||'').slice(0,4)})</span><br><small class="mut">${esc((x.overview||'').slice(0,110))}…</small></div></div>`).join('')||'<p class="mut">Nichts gefunden.</p>'}
  catch(e){$('#res').innerHTML=`<p>${esc(e.message)}</p>`}
}
async function pick(tid){
  $('#res').innerHTML='<p class="mut">Lade Details…</p>';
  try{draft.tmdbId=tid;draft.d=await fetchDetails(tid);if(draft.relink){const f=films.find(x=>x.id===draft.relink);f.tmdbId=tid;f.d=draft.d;f.manual=true;save();draw();openDetail(f.id);return}draft.target==='wish'?wishForm({}):formStep({})}catch(e){alert(e.message)}
}
function formStep(f,id){
  const d=draft.d;
  $('#dlg').innerHTML=`<h2>${esc(d.title)} <span class="mut">(${esc(d.year)})</span></h2>${dupWarn(id)}
  <label>Format</label><select id="fm">${allFormats().map(x=>`<option ${x===(f.format||draft.hint?.format||cfg.lastFormat)?'selected':''}>${x}</option>`).join('')}</select>
  <label>Edition / Version (z. B. Steelbook, Director's Cut, Mediabook)</label><input id="ed" value="${esc(f.edition||draft.hint?.edition||'')}">
  <label>Barcode / EAN</label><div style="display:flex;gap:8px"><input id="ea" style="flex:1" value="${esc(f.ean??draft.ean??'')}"><button onclick="scanInto()">📷 Scannen</button></div><div id="scanbox"></div>
  <label>FSK (leer = automatisch${d.fsk?': '+d.fsk:''})</label><select id="fk"><option value="">Automatisch</option>${['0','6','12','16','18'].map(x=>`<option ${x===f.fsk?'selected':''}>${x}</option>`).join('')}</select>
  <label>Sprachen auf der Disc (z. B. Deutsch, Englisch)</label><input id="la" value="${esc(f.langs||'')}">${chips('la',LANGS,true)}
  <label>Untertitel (z. B. Deutsch, Englisch)</label><input id="su" value="${esc(f.subs||'')}">${chips('su',SUBS,true)}
  <label>Filmreihe (leer = automatisch${d.collection?': '+esc(d.collection):''})</label><input id="se" list="sl" value="${esc(f.series||'')}"><datalist id="sl">${[...new Set(films.map(serOf).filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <label>Lagerort (z. B. Wohnzimmer Regal 2)</label><input id="lo" value="${esc(f.loc||'')}">
  <label>Region (z. B. B)</label><input id="rg2" value="${esc(f.region||'')}">${chips('rg2',REGIONS,false)}
  <label>Bildformat (z. B. 2.35:1)</label><input id="as" value="${esc(f.aspect||'')}">${chips('as',ASPECTS,false)}
  <label>Anzahl Disks</label><input id="dk" value="${esc(f.disks||'')}">${chips('dk',DISKS,false)}
  <label>Bonusmaterial</label><textarea id="bo" rows="2">${esc(f.bonus||'')}</textarea>
  <label>Box (optional, z. B. Der Pate – Box)</label><input id="bx" list="bl" value="${esc(f.box||'')}"><datalist id="bl">${[...new Set(films.map(x=>x.box).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
  <label>Verliehen an (leer = nicht verliehen)</label><input id="lt" value="${esc(f.lentTo||'')}">
  <label>Verliehen seit</label><input id="ls" type="date" value="${esc(f.lentSince||'')}">
  <label>Tonformat (z. B. Dolby Digital 5.1)</label><input id="ton" value="${esc(f.ton||'')}">${chips('ton',TONS,false)}
  <label>Notizen</label><textarea id="no" rows="2">${esc(f.notes||'')}</textarea>
  <div class="bar"><button onclick="$('#dlg').close()">Abbrechen</button><button class="p" onclick="commit('${id||''}')">Speichern</button></div>`;
}
function commit(id){
  const o={lentTo:$('#lt').value.trim(),lentSince:$('#lt').value.trim()?($('#ls').value||new Date().toISOString().slice(0,10)):'',ton:$('#ton').value.trim(),box:$('#bx').value.trim(),region:$('#rg2').value.trim(),aspect:$('#as').value.trim(),disks:$('#dk').value.trim(),bonus:$('#bo').value.trim(),loc:$('#lo').value.trim(),fsk:$('#fk').value,langs:$('#la').value.trim(),subs:$('#su').value.trim(),series:$('#se').value.trim(),format:$('#fm').value,edition:$('#ed').value.trim(),ean:$('#ea').value.trim(),notes:$('#no').value.trim()};cfg.lastFormat=o.format;
  if(id)Object.assign(films.find(f=>f.id===id),o);
  else films.push({id:crypto.randomUUID(),tmdbId:draft.tmdbId,d:draft.d,added:Date.now(),...o});
  save();draw();$('#dlg').close();
}
function pickCover(id){const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=async()=>{try{const f=films.find(x=>x.id===id),bmp=await createImageBitmap(i.files[0]);
  const s=Math.min(1,400/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  f.cover=c.toDataURL('image/jpeg',0.85);save();draw();openDetail(id)}catch(e){alert('Bild konnte nicht gelesen werden')}};i.click()}
function relink(id){const f=films.find(x=>x.id===id);openAdd();draft.relink=id;$('#s').value=f.title0||f.d.title}
function openEdit(id){const f=films.find(x=>x.id===id);draft={d:f.d,tmdbId:f.tmdbId};formStep(f,id);}

let stream,loop;
async function scan(){
  const box=$('#scanbox');
  if(!('BarcodeDetector' in window)){box.innerHTML='<p>Dieser Browser kann keine Codes scannen. Bitte Chrome (Android/Desktop) nutzen, oder Titel eintippen.</p>';return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}catch(e){box.innerHTML='<p>Kein Kamerazugriff.</p>';return}
  box.innerHTML='<video id="v" autoplay playsinline muted></video>';const v=$('#v');v.srcObject=stream;
  const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','qr_code']});
  loop=setInterval(async()=>{try{const c=await det.detect(v);if(c.length){stopScan();(onCode||gotCode)(c[0].rawValue)}}catch(e){}},400);
}
function stopScan(){clearInterval(loop);stream?.getTracks().forEach(t=>t.stop())}
$('#dlg').addEventListener('close',stopScan);
async function gotCode(code){
  draft.ean=code;$('#scanbox').innerHTML=`<p>Code erkannt: <b>${esc(code)}</b> – suche Produkt…</p>`;
  if(/^https?:/.test(code)){$('#scanbox').innerHTML+='<p>QR-Code enthält einen Link; bitte Titel manuell suchen.</p>';return}
  try{const r=await (await fetch('https://api.upcitemdb.com/prod/trial/lookup?upc='+code)).json();
    const t=r.items?.[0]?.title;draft.hint=hintFrom(t||'');
    if(t){const clean=t.replace(/\(.*?\)|\[.*?\]|blu-?ray|dvd|4k|uhd|steelbook|edition/gi,'').replace(/\s+/g,' ').trim();$('#s').value=clean;search(clean);return}}catch(e){}
  $('#scanbox').innerHTML+='<p>Zu diesem Code wurde kein Titel gefunden – bitte Titel eintippen, der Code wird übernommen.</p>';
}

function openSet(){
  $('#setv').innerHTML=`<div class="bar" style="justify-content:space-between;align-items:center"><h2>Einstellungen</h2><button class="p" onclick="closeSet()">Fertig</button></div><h3 class="sh">Datenquellen</h3>
  <label>TMDB API-Schlüssel (kostenlos auf themoviedb.org → Einstellungen → API) – nötig für Filminfos</label><input id="k1" value="${esc(cfg.tmdb||'')}">
  <label>OMDb API-Schlüssel (kostenlos auf omdbapi.com) – optional, für die echte IMDb-Wertung</label><input id="k2" value="${esc(cfg.omdb||'')}">
  <h3 class="sh">Sammlung</h3>${fmtEditor()}<h3 class="sh">Erscheinungsbild</h3>${accentEditor()}${fskEditor()}${accountEditor()}<div class="bar"><button class="p" onclick="cfg.tmdb=$('#k1').value;cfg.omdb=$('#k2').value;save();closeSet()">Speichern</button>
  <button onclick="exp()">Sammlung exportieren</button><button onclick="rematch()">Zuordnung korrigieren</button><button onclick="reloadAll()">Alle Filminfos neu laden</button><button onclick="$('#imp').click()">Importieren</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div>
  <p class="mut" style="margin-top:18px">Version ${APP_VERSION}</p><p class="mut">Daten liegen lokal in diesem Browser. Mach regelmäßig einen Export als Backup.</p>${(!cfg.lastBackup||Date.now()-cfg.lastBackup>14*864e5)&&(films.length||wish.length)?'<p><b>⚠ Letzte Sicherung ist älter als 14 Tage oder fehlt. Bitte jetzt exportieren.</p>':''}`;
  $('#setv').style.display='block';
}
function closeSet(){const v=$('#setv');v.style.display='none';v.innerHTML=''}
async function reloadAll(){if(!confirm('Alle Filminfos neu von TMDB laden (holt FSK und Filmreihen)? Dauert ein paar Minuten.'))return;
 const q=films.filter(f=>f.tmdbId),tot=q.length;let n=0;$('#setv').innerHTML='<h2>Aktualisiere…</h2><p id="pg"></p><p class="mut">Bitte Fenster offen lassen.</p>';
 const w=async()=>{for(let f;f=q.shift();){try{f.d=await fetchDetails(f.tmdbId)}catch(e){}n++;$('#pg').textContent=n+' / '+tot;if(n%25===0){save();draw()}}};
 await Promise.all([w(),w(),w(),w()]);save();draw();closeSet()}
async function rematch(){
 const q=films.filter(f=>f.title0&&!f.manual);
 if(!q.length)return alert('Keine Filme zum Prüfen.');
 if(!confirm('Alle '+q.length+' automatisch zugeordneten Filme neu prüfen? Nur eindeutige Treffer werden übernommen. Format, Edition und Notizen bleiben erhalten.'))return;
 const taken=new Set(films.filter(f=>f.tmdbId).map(f=>f.tmdbId));
 let n=0,ch=0;const tot=q.length;
 $('#dlg').innerHTML='<h2>Prüfe…</h2><p id="pg"></p><p class="mut">Bitte Fenster offen lassen.</p>';
 const w=async()=>{for(let f;f=q.shift();){try{const id=await bestMatch(f.title0);
   if(id&&id!==f.tmdbId&&!taken.has(id)){taken.add(id);f.tmdbId=id;f.d=await fetchDetails(id);ch++}}catch(e){}
   n++;$('#pg').textContent=n+' / '+tot}};
 await Promise.all([w(),w(),w(),w()]);save();draw();
 $('#dlg').innerHTML=`<h2>Fertig</h2><p>${ch} Zuordnungen korrigiert. Filme mit ⚠ oder doppeltem Treffer bitte über „Anderen Film zuordnen“ prüfen.</p><div class="bar"><button class="p" onclick="$('#dlg').close()">OK</button></div>`}

function exp(){cfg.lastBackup=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({films,wish,cfg},null,1)],{type:'application/json'}));a.download='filmsammlung-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
async function imp(file){let j;try{j=JSON.parse(await file.text())}catch(e){return alert('Ungültige Datei')}
 if(!Array.isArray(j)){films=j.films||[];wish=j.wish||[];cfg={...cfg,...j.cfg};save();draw();closeSet();return}
 if(!cfg.tmdb)return alert('Bitte zuerst den TMDB-Schlüssel speichern.');
 const have=new Set(films.map(f=>f.title0));const q=j.filter(x=>!have.has(x.title)),total=q.length;let n=0,bad=0;
 $('#setv').innerHTML='<h2>Import läuft…</h2><p id="pg"></p><p class="mut">Bitte dieses Fenster offen lassen.</p>';
 const clean=s=>s.replace(/[–:&’'.]/g,' ').replace(/\s+/g,' ').trim();
 const taken=new Set(films.filter(f=>f.tmdbId).map(f=>f.tmdbId));
 const work=async()=>{for(let x;x=q.shift();){
  const f={id:crypto.randomUUID(),title0:x.title,format:x.format||'Nicht angegeben',edition:'',ean:'',notes:'',added:Date.now()+n};
  try{const id=await bestMatch(x.title);if(id&&!taken.has(id)){taken.add(id);f.tmdbId=id;f.d=await fetchDetails(id)}}catch(e){}
  if(!f.d){bad++;f.d={title:x.title,orig:'',year:'',poster:null,overview:'',genres:[],countries:[],directors:[],cast:[],unmatched:true}}
  films.push(f);n++;$('#pg').textContent=`${n} / ${total} (nicht zugeordnet: ${bad})`;if(n%25===0){save();draw()}}};
 await Promise.all([work(),work(),work(),work()]);save();draw();
 $('#setv').innerHTML=`<h2>Fertig</h2><p>${n} Filme importiert, ${bad} konnten nicht automatisch zugeordnet werden (mit ⚠ markiert).</p><div class="bar"><button class="p" onclick="closeSet()">OK</button></div>`}
applyTheme();applyAccent();sbInit();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
draw();if(!cfg.tmdb)setTimeout(openSet,300);
</script></body></html>
